# Fox Den Seoul terminal theme
font_family Monaspace Radon NF
font_size 11.5

window_padding_width 14
placement_strategy center

background #070b12
foreground #edf7ff
background_opacity 0.91

cursor #25d9ff
cursor_text_color #070b12
cursor_shape beam
cursor_blink_interval 0.6

selection_background #263951
selection_foreground #ffffff

url_color #25d9ff

active_border_color #ff681f
inactive_border_color #24344c
bell_border_color #df55ff

enable_audio_bell no

tab_bar_style powerline
tab_powerline_style round
tab_bar_align left
tab_bar_min_tabs 2
tab_bar_background #070b12

active_tab_foreground #070b12
active_tab_background #ff681f
active_tab_font_style bold

inactive_tab_foreground #8291a5
inactive_tab_background #111823
inactive_tab_font_style normal


# BEGIN_KITTY_FONTS
font_family      family="Monaspace Radon NF"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

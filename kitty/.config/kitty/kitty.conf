# vim:fileencoding=utf-8
# ==============================================================================
# Fox Den Midnight (DenKit v0.1) — Kitty terminal
# ==============================================================================
# This is the active, opinionated Kitty config. It intentionally contains only
# settings used by the Fox Den build rather than Kitty's full default baseline.

# ------------------------------------------------------------------------------
# Font
# ------------------------------------------------------------------------------
# Generated around the Monaspace Radon Nerd Font selected with choose-fonts.
font_family      family="Monaspace Radon NF"
bold_font        auto
italic_font      auto
bold_italic_font auto

symbol_map U+1100-U+11FF LXGW WenKai Mono KR
symbol_map U+3130-U+318F LXGW WenKai Mono KR
symbol_map U+A960-U+A97F LXGW WenKai Mono KR
symbol_map U+AC00-U+D7AF LXGW WenKai Mono KR
symbol_map U+D7B0-U+D7FF LXGW WenKai Mono KR

font_size 11.5

# Keep programming ligatures, but break them beneath the cursor while editing.
disable_ligatures cursor

# Make diagnostics from Neovim and other TUIs easier to see.
undercurl_style thick-dense


# ------------------------------------------------------------------------------
# Window geometry and internal Kitty splits
# ------------------------------------------------------------------------------
window_padding_width 14
placement_strategy center

# Kitty's own split/window layouts. "splits" is the startup layout.
enabled_layouts splits,stack,tall

window_border_width 2px
draw_minimal_borders yes
draw_window_borders_for_single_window no

active_border_color   #97E7CA
inactive_border_color #36495D
bell_border_color     #F5AD66

# Slightly fade inactive Kitty panes without making them difficult to read.
inactive_text_alpha 0.92

# Hyprland handles the outer window decorations.
hide_window_decorations yes

# Prompt before closing when a foreground or background job is still active.
confirm_os_window_close -1 count-background


# ------------------------------------------------------------------------------
# Fox Den Midnight (DenKit v0.1) colors
# ------------------------------------------------------------------------------
foreground #F7F5E9
background #0B1423

background_opacity 0.91
dynamic_background_opacity yes
dim_opacity 0.55

selection_background #F68D91
selection_foreground #0B1423

# Standard + bright ANSI palette.
# These colors are used by shells, Git, eza, bat, Neovim, system tools, and TUIs.
color0  #142335
color8  #AFC0D1

color1  #EF5261
color9  #EF5261

color2  #97E7CA
color10 #97E7CA

color3  #F5AD66
color11 #F5AD66

color4  #97E7CA
color12 #97E7CA

color5  #F68D91
color13 #F68D91

color6  #97E7CA
color14 #97E7CA

color7  #AFC0D1
color15 #F7F5E9

# Kitty marks used by prompt navigation and other integrations.
mark1_foreground #0B1423
mark1_background #97E7CA
mark2_foreground #0B1423
mark2_background #F5AD66
mark3_foreground #0B1423
mark3_background #F68D91


# ------------------------------------------------------------------------------
# Cursor
# ------------------------------------------------------------------------------
cursor #97E7CA
cursor_text_color #0B1423

cursor_shape beam
cursor_shape_unfocused hollow
cursor_beam_thickness 2.0

cursor_blink_interval 0.6
cursor_stop_blinking_after 10.0

# A restrained mint cursor trail for large jumps in editors and shell history.
cursor_trail 120
cursor_trail_decay 0.08 0.28
cursor_trail_start_threshold 3
cursor_trail_color #97E7CA


# ------------------------------------------------------------------------------
# Scrollback and progress
# ------------------------------------------------------------------------------
scrollback_lines 10000
scrollback_pager_history_size 32

scrollbar scrolled
scrollbar_interactive yes
scrollbar_width 0.50
scrollbar_hover_width 0.85
scrollbar_handle_opacity 0.70
scrollbar_handle_color #97E7CA
scrollbar_track_opacity 0

progress_bar top

wheel_scroll_multiplier 3.0
pixel_scroll yes


# ------------------------------------------------------------------------------
# Mouse, links, selection, and paste safety
# ------------------------------------------------------------------------------
mouse_hide_wait 2.0

url_color #97E7CA
url_style curly
detect_urls yes
underline_hyperlinks hover
show_hyperlink_targets ctrl
open_url_with default

# Deliberately do not copy merely by selecting text.
copy_on_select no

# Quote URLs at a shell prompt and confirm potentially dangerous pasted content.
paste_actions quote-urls-at-prompt,confirm
strip_trailing_spaces smart


# ------------------------------------------------------------------------------
# Bell and long-running command notifications
# ------------------------------------------------------------------------------
enable_audio_bell no

visual_bell_duration 0.0
visual_bell_color #25384B
window_alert_on_bell yes
bell_on_tab "󰂞 "

# Notify only when a command takes at least ten seconds and the terminal is not
# currently visible.
notify_on_cmd_finish invisible 10.0 notify


# ------------------------------------------------------------------------------
# Tabs
# ------------------------------------------------------------------------------
tab_bar_edge top
# A subtle slate divider appears below the tab bar only when the bar is visible.
tab_bar_margin_height 0.0 1.0
tab_bar_style powerline
tab_powerline_style round
tab_bar_align left
tab_bar_min_tabs 2
tab_switch_strategy previous

tab_bar_background #0B1423
tab_bar_margin_color #36495D

active_tab_foreground #0B1423
active_tab_background #F68D91
active_tab_font_style bold

inactive_tab_foreground #AFC0D1
inactive_tab_background #142335
inactive_tab_font_style normal

tab_activity_symbol "● "
tab_title_max_length 30

# Nerd Font terminal icon + tab index + application/current-directory title.
tab_title_template " {index}: {title} "
active_tab_title_template "  {index}: {title} "


# ------------------------------------------------------------------------------
# Shell integration and editor
# ------------------------------------------------------------------------------
editor nvim
shell_integration enabled

# Keep Kitty remote control disabled until a specific, restricted use is needed.
allow_remote_control no

# Ask before a program requests a cloned shell.
allow_cloning ask

# Programs may write to the clipboard. Reads still require confirmation.
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
clipboard_max_size 64

allow_hyperlinks yes

# Reload edited config files automatically.
auto_reload_config 0.2

# Arch's package manager handles Kitty updates.
update_check_interval 0

# Preserve Korean input support through fcitx5 on Wayland.
wayland_enable_ime yes


# ------------------------------------------------------------------------------
# Small quality-of-life mappings
# ------------------------------------------------------------------------------
# Open a new Kitty pane in the current working directory.
map ctrl+shift+enter launch --cwd=current

# Clear the current prompt area while moving prior output into scrollback.
map ctrl+l clear_terminal to_cursor_scroll active

# Reload this file manually when needed.
map ctrl+shift+f5 load_config_file

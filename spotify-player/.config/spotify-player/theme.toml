# Fox Den Midnight / DenKit v0.1. Keep the existing fox_den theme ID.
[[themes]]
name = "fox_den"

[themes.palette]
background = "#0B1423"
foreground = "#F7F5E9"

black = "#142335"
red = "#EF5261"
green = "#97E7CA"
yellow = "#F5AD66"
blue = "#97E7CA"
magenta = "#F68D91"
cyan = "#97E7CA"
white = "#AFC0D1"

bright_black = "#AFC0D1"
bright_red = "#EF5261"
bright_green = "#97E7CA"
bright_yellow = "#F5AD66"
bright_blue = "#97E7CA"
bright_magenta = "#F68D91"
bright_cyan = "#97E7CA"
bright_white = "#F7F5E9"

[themes.component_style]
block_title = { fg = "#97E7CA", modifiers = ["Bold"] }
border = { fg = "#36495D" }

playback_status = { fg = "#97E7CA", modifiers = ["Bold"] }
playback_track = { fg = "#F7F5E9", modifiers = ["Bold"] }
playback_artists = { fg = "#97E7CA" }
playback_album = { fg = "#F68D91" }
playback_genres = { fg = "#AFC0D1", modifiers = ["Italic"] }
playback_metadata = { fg = "#AFC0D1" }

playback_progress_bar = { fg = "#F5AD66" }
playback_progress_bar_unfilled = { fg = "#36495D" }

current_playing = { fg = "#97E7CA", modifiers = ["Bold"] }
page_desc = { fg = "#97E7CA", modifiers = ["Bold"] }
playlist_desc = { fg = "#AFC0D1" }
table_header = { fg = "#F68D91", modifiers = ["Bold"] }

selection = { fg = "#0B1423", bg = "#F68D91", modifiers = ["Bold"] }
secondary_row = { fg = "#AFC0D1" }
like = { fg = "#F68D91", modifiers = ["Bold"] }

lyrics_played = { fg = "#AFC0D1" }
lyrics_playing = { fg = "#97E7CA", modifiers = ["Bold"] }

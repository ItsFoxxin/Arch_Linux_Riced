input-field {
    monitor =

    size = 560, 72
    outline_thickness = 3

    outer_color = rgba(00d9ffff) rgba(ff7a18ff) 90deg
    inner_color = rgba(030914e8)
    font_color = $orange_soft

    check_color = rgba(ff7a18ff) rgba(00d9ffff) 90deg
    fail_color = rgba(ff315cff) rgba(ff4fd8ff) 90deg
    capslock_color = rgba(ffc247ff)

    font_family = $font_en

    placeholder_text = <span foreground="##91a7b5">Enter password...</span>
    check_text = <span foreground="##ff9b58">확인 중...</span>
    fail_text = <span foreground="##ff5577">Access denied  •  인증 실패  ($ATTEMPTS)</span>

    dots_size = 0.27
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false
    swap_font_color = false
    rounding = -1

    position = 0, -245
    halign = center
    valign = center

    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(00d9ff66)
    shadow_boost = 1.4

    zindex = 3
}


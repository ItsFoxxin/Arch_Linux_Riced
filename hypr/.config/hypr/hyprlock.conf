# ─────────────────────────────────────────────────────────────
# Fox Den Hyprlock
# Target display: 1920x1080
# UTF-8 Korean text is written literally in this file.
# ─────────────────────────────────────────────────────────────

$font_en = Monaspace Radon NF
$font_kr = LXGW WenKai Mono KR

# Fox Den Midnight native Hyprlang tokens. Keep the panel nearly opaque
# so its text remains readable over the existing wallpaper.
$midnight = rgba(0b1423ff)
$slate = rgba(25384bff)
$mint = rgba(97e7caff)
$coral = rgba(f68d91ff)
$amber = rgba(f5ad66ff)
$cream = rgba(f7f5e9ff)
$raised = rgba(142335ff)
$border = rgba(36495dff)
$muted = rgba(afc0d1ff)
$critical = rgba(ef5261ff)
$panel = rgba(142335f2)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fail_timeout = 2000
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
}

animations {
    enabled = true

    bezier = foxEase, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, foxEase
    animation = fadeOut, 1, 4, foxEase
    animation = inputFieldDots, 1, 2, foxEase
    animation = inputFieldColors, 1, 3, foxEase
}

background {
    monitor =

    path = /home/foxxin/.config/hypr/assets/hyprlock/fox-den-lock-bg.png
    color = $midnight

    blur_passes = 0
    brightness = 0.78
    contrast = 1.04
    vibrancy = 0.15
    vibrancy_darkness = 0.05
    noise = 0.004

    zindex = -2
}

shape {
    monitor =

    size = 880, 920
    color = $panel
    rounding = 30

    border_size = 2
    border_color = $border

    position = 0, 0
    halign = center
    valign = center

    shadow_passes = 5
    shadow_size = 22
    shadow_color = rgba(000000dd)
    shadow_boost = 1.4

    zindex = 0
}

image {
    monitor =

    path = /home/foxxin/.config/hypr/assets/hyprlock/fox-den-logo.png
    size = 126
    rounding = 0
    border_size = 0

    position = 0, 350
    halign = center
    valign = center

    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(0b1423aa)
    shadow_boost = 1.5

    zindex = 2
}

label {
    monitor =

    text = THE FOX DEN
    color = $amber
    font_size = 38
    font_family = $font_en

    position = 0, 265
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0b142377)

    zindex = 2
}

label {
    monitor =

    text = 여우굴
    color = $amber
    font_size = 28
    font_family = $font_kr

    position = 0, 215
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0b142377)

    zindex = 2

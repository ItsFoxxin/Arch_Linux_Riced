# ─────────────────────────────────────────────────────────────
# Fox Den Hyprlock
# Target display: 1920x1080
# UTF-8 Korean text is written literally in this file.
# ─────────────────────────────────────────────────────────────

$font_en = Monaspace Radon NF
$font_kr = Noto Sans CJK KR

$orange = rgba(ff7a18ff)
$orange_soft = rgba(ff9b58ff)
$cyan = rgba(00d9ffff)
$cyan_soft = rgba(7ceaffff)
$pink = rgba(ff4fd8ff)
$panel = rgba(04071199)
$text = rgba(eafaffff)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fail_timeout = 2000
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
}

animations {
    enabled = true

    bezier = foxEase, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, foxEase
    animation = fadeOut, 1, 4, foxEase
    animation = inputFieldDots, 1, 2, foxEase
    animation = inputFieldColors, 1, 3, foxEase
}

background {
    monitor =

    path = /home/foxxin/.config/hypr/assets/hyprlock/fox-den-lock-bg.png
    color = rgba(03050cff)

    blur_passes = 0
    brightness = 0.78
    contrast = 1.04
    vibrancy = 0.15
    vibrancy_darkness = 0.05
    noise = 0.004

    zindex = -2
}

shape {
    monitor =

    size = 880, 920
    color = $panel
    rounding = 30

    border_size = 2
    border_color = rgba(ff7a18dd) rgba(00d9ffdd) 90deg

    position = 0, 0
    halign = center
    valign = center

    shadow_passes = 5
    shadow_size = 22
    shadow_color = rgba(000000dd)
    shadow_boost = 1.4

    zindex = 0
}

image {
    monitor =

    path = /home/foxxin/.config/hypr/assets/hyprlock/fox-den-logo.png
    size = 126
    rounding = 0
    border_size = 0

    position = 0, 350
    halign = center
    valign = center

    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(ff7a18aa)
    shadow_boost = 1.5

    zindex = 2
}


general {
	hide_cursor = true
	ignore_empty_input = true
	immediate_render = true
}

auth {
	pam {
		enabled = true
		module = hyprlock
	}
}

background {
	monitor =
	path = screenshot
	blur_passes = 3
	blur_size = 7
	brightness = 0.55
	contrast = 1.05
	vibrancy = 0.20
}

label {
	monitor =
	text = cmd[update:1000] date +"%I:%M %p"
	font_family = Monaspace Radon NF
	font_size = 72
	color = rbga(00d9ffff)
	position = 0, 160
	halign = center
	valign = center
	shadow_passes = 2
}

label {
	monitor =
	text = cmd[udpate:60000] date +"%A, %B %d"
	font_family = Monaspace Radon NF
	font_size = 22
	color = rgba(ff7a18ff)
	position = 0, 95
	halign = center
	valign = center
}

label {
	monitor =
	text = The Fox Den
	font_family = Monaspace Radon NF
	font_size = 26
	color = rgba(ff7a18ff)
	position = 0, -115
	halign = center
	valign = center
}

input-field {
	monitor =
	size = 360, 60
	outline_thickness = 3

	outer_color = rgba(00d9ffff)
	inner_color = rgba(080b14dd)
	font_color = rgba(ff7a18ff)

	check_color = rgba(ff7a18ff)
	fail_color = rgba(ff3355ff)
	capslock_color = rgba(ff7a18ff)

	font_family = Monaspace Radon NF
	placeholder_text = <i>Enter password...</i>
	fail_text = <i>Access denied ($ATTEMPTS)</i>

	rounding = 16
	fade_on_empty = false

	position = 0, -15
	halign = center
	valign = center

	shadow_passes = 3
	shadow_size = 8
	shadow_color = rgba(000000aa)
}

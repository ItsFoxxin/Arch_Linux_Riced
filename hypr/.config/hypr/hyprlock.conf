input-field {
    monitor =

    size = 560, 72
    outline_thickness = 3

    outer_color = $mint
    inner_color = $midnight
    font_color = $cream

    check_color = $amber
    fail_color = $critical
    capslock_color = $amber

    font_family = $font_en, $font_kr

    placeholder_text = <span foreground="##AFC0D1">Enter password...</span>
    check_text = <span foreground="##F5AD66">확인 중...</span>
    fail_text = <span foreground="##EF5261">Access denied  •  인증 실패  ($ATTEMPTS)</span>

    dots_size = 0.27
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false
    swap_font_color = false
    rounding = -1

    position = 0, -245
    halign = center
    valign = center

    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(0b142366)
    shadow_boost = 1.4

    zindex = 3
}


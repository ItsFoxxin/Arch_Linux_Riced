input-field {
    monitor =
    size = 438, 66
    outline_thickness = 2
    outer_color = $mint
    inner_color = $midnight
    font_color = $cream
    check_color = $amber
    fail_color = $critical
    capslock_color = $coral
    font_family = $font_en, $font_kr
    placeholder_text = <span foreground="##AFC0D1">Unlock the Den  •  비밀번호</span>
    check_text = <span foreground="##F5AD66">Checking credentials...</span>
    fail_text = <span foreground="##EF5261">Access denied  •  인증 실패  ($ATTEMPTS)</span>
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    swap_font_color = false
    rounding = 16
    position = -610, -216
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(00000077)
    zindex = 3
}

label {
    monitor =
    text = FOX DEN SECURITY  //  STAY CLEVER
    color = $muted
    font_family = $font_en
    font_size = 12
    position = -610, -278
    halign = center
    valign = center
    zindex = 2
}

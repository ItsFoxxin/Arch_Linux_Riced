# Fox Den Midnight | Animated Hyprlock (preview)
# Intended for a single 1920x1080 eDP-1 laptop display.
# The test launcher renders the local MP4 behind this TRANSPARENT lock surface.
# Do not use this config as the default lock without the companion launcher.

$font_en = Monaspace Radon NF
$font_kr = LXGW WenKai Mono KR

$midnight = rgba(0b1423ff)
$cream = rgba(f7f5e9ff)
$muted = rgba(afc0d1ff)
$mint = rgba(97e7caff)
$amber = rgba(f5ad66ff)
$coral = rgba(f68d91ff)
$critical = rgba(ef5261ff)
$border = rgba(36495dff)
$panel = rgba(0b1423df)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fail_timeout = 2000
    # Avoid capturing real workspace content into lockscreen background textures.
    disable_screencopy = true
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
}

animations {
    enabled = true
    bezier = foxEase, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, foxEase
    animation = fadeOut, 1, 4, foxEase
    animation = inputFieldDots, 1, 2, foxEase
    animation = inputFieldColors, 1, 3, foxEase
}

# Hyprland's session_lock_xray supplies the live layer underneath.
# No screenshot, static-image background, or obscuring black bars.
background {
    monitor =
    color = rgba(00000000)
    blur_passes = 0
    zindex = -2
}

# Readable midnight glass, leaving the cinematic fox visible around the edges.
shape {
    monitor =
    size = 630, 650
    color = $panel
    rounding = 28
    border_size = 2
    border_color = $border
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 24
    shadow_color = rgba(00000099)
    zindex = 0
}

# Small mint accent at the top of the panel.
shape {
    monitor =
    size = 90, 4
    color = $mint
    rounding = 2
    position = 0, 310
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = THE FOX DEN
    color = $cream
    font_family = $font_en
    font_size = 38
    position = 0, 248
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = 여우굴  /  MIDNIGHT SESSION
    color = $amber
    font_family = $font_kr
    font_size = 17
    position = 0, 201
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 490, 2
    color = $border
    position = 0, 164
    halign = center
    valign = center
    zindex = 2
}

# Two 24-hour clocks, preserving the original Fox Den pairing.
label {
    monitor =
    text = cmd[update:1000] env TZ=America/New_York date +"%H:%M"
    color = $mint
    font_family = $font_en
    font_size = 45
    position = -143, 90
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = PENNSYLVANIA
    color = $muted
    font_family = $font_en
    font_size = 16
    position = -143, 44
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] env TZ=America/New_York date +"%a, %b %-d"
    color = $muted
    font_family = $font_en
    font_size = 14
    position = -143, 15
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 2, 130
    color = $border
    position = 0, 80
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] env TZ=Asia/Seoul date +"%H:%M"
    color = $amber
    font_family = $font_en
    font_size = 45
    position = 143, 90
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = 서울  /  SEOUL
    color = $muted
    font_family = $font_kr
    font_size = 17
    position = 143, 44
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] env TZ=Asia/Seoul date +"%Y-%m-%d"
    color = $muted
    font_family = $font_en
    font_size = 14
    position = 143, 15
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 490, 2
    color = $border
    position = 0, -31
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = 시작이 반이다.
    color = $cream
    font_family = $font_kr
    font_size = 29
    position = 0, -86
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = Welcome back, $USER
    color = $muted
    font_family = $font_en
    font_size = 15
    position = 0, -129
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 470, 64
    outline_thickness = 3
    outer_color = $mint
    inner_color = $midnight
    font_color = $cream
    check_color = $amber
    fail_color = $critical
    capslock_color = $coral
    font_family = $font_en, $font_kr
    placeholder_text = <span foreground="##AFC0D1">Unlock the Den  •  비밀번호</span>
    check_text = <span foreground="##F5AD66">Checking credentials...</span>
    fail_text = <span foreground="##EF5261">Access denied  •  인증 실패  ($ATTEMPTS)</span>
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    swap_font_color = false
    rounding = 14
    position = 0, -208
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(00000077)
    zindex = 3
}

label {
    monitor =
    text = FOX DEN SECURITY  //  STAY CLEVER
    color = $muted
    font_family = $font_en
    font_size = 12
    position = 0, -287
    halign = center
    valign = center
    zindex = 2
}

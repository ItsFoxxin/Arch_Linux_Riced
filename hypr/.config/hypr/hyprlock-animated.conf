# Fox Den Midnight | Animated Hyprlock (preview)
# Tuned for a 1920x1080 single-screen laptop: bench-side panel, fox visible at right.
# The test launcher renders the local MP4 behind this TRANSPARENT lock surface.
# Do not use this config as the default lock without the companion launcher.

$font_en = Monaspace Radon NF
$font_kr = LXGW WenKai Mono KR

$midnight = rgba(0b1423ff)
$cream = rgba(f7f5e9ff)
$muted = rgba(afc0d1ff)
$mint = rgba(97e7caff)
$amber = rgba(f5ad66ff)
$coral = rgba(f68d91ff)
$critical = rgba(ef5261ff)
$border = rgba(36495dff)
$panel = rgba(0b1423dc)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fail_timeout = 2000
    # Avoid capturing real workspace content into lockscreen background textures.
    disable_screencopy = true
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
}

animations {
    enabled = true
    bezier = foxEase, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, foxEase
    animation = fadeOut, 1, 4, foxEase
    animation = inputFieldDots, 1, 2, foxEase
    animation = inputFieldColors, 1, 3, foxEase
}

# Hyprland's session_lock_xray supplies the live layer underneath.
# No screenshot, static-image background, or obscuring black bars.
background {
    monitor =
    color = rgba(00000000)
    blur_passes = 0
    zindex = -2
}

# Compact midnight glass, aligned by the bench on the LEFT; the fox stays clear.
shape {
    monitor =
    size = 560, 610
    color = $panel
    rounding = 28
    border_size = 2
    border_color = rgba(97e7ca55)
    position = -610, 0
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 24
    shadow_color = rgba(00000099)
    zindex = 0
}

# Mint rule and status typography add structure without a solid header band.
shape {
    monitor =
    size = 78, 3
    color = $mint
    rounding = 2
    position = -610, 286
    halign = center
    valign = center
    zindex = 2
}

# A small status line makes the lock intentional without covering the scenery.
label {
    monitor =
    text = SECURE WORKSTATION  /  잠금 화면
    color = $mint
    font_family = $font_kr
    font_size = 12
    position = -610, 255
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = THE FOX DEN
    color = $cream
    font_family = $font_en
    font_size = 34
    position = -610, 208
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = 여우굴  /  MIDNIGHT ACCESS
    color = $amber
    font_family = $font_kr
    font_size = 16
    position = -610, 163
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 460, 2
    color = $border
    position = -610, 129
    halign = center
    valign = center
    zindex = 2
}

# Two 24-hour clocks, preserving the original Fox Den pairing.
label {
    monitor =
    text = cmd[update:1000] env TZ=America/New_York date +"%H:%M"
    color = $mint
    font_family = $font_en
    font_size = 42
    position = -753, 64
    halign = center
    valign = center
    zindex = 2
}

label {

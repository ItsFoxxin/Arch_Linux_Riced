# Fox Den Midnight — DenKit v0.1 — Starship prompt
# Target: Starship 1.26.x with Bash 5.3+

"$schema" = "https://starship.rs/config-schema.json"

palette = "fox_den_midnight"

add_newline = false
command_timeout = 800
scan_timeout = 30

# Option B with an adaptive identity label:
# - 100 columns or wider: "🦊 FOX DEN"
# - below 100 columns:   "🦊"
# The frame remains in both modes, while paths and Git branches are truncated.
format = """
[╭─](bold fg:amber) \
${custom.root}\
${custom.ssh}\
${custom.fox_den}\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$jobs\
$cmd_duration\
$status\
$line_break\
[╰─](bold fg:amber) \
$character"""

continuation_prompt = "[│](bold fg:muted) "

# ── Fox Den identity and safety context ──────────────────────────────────────

[custom.fox_den]
command = '''
cols="$(tput cols 2>/dev/null || printf '120')"
case "$cols" in
    ''|*[!0-9]*) cols=120 ;;
esac

if [ "$cols" -ge 100 ]; then
    printf '🦊 FOX DEN'
else
    printf '🦊'
fi
'''
when = '''test "$(id -u)" -ne 0 && test -z "${SSH_CONNECTION:-}"'''
shell = ["/bin/sh"]
style = "bold fg:amber"
format = "[$output]($style) "
description = "Adaptive Fox Den identity"

[custom.root]
command = "printf 'ROOT'"
when = '''test "$(id -u)" -eq 0'''
shell = ["/bin/sh"]
style = "bold fg:midnight bg:critical"
format = "[ $output ]($style) "
description = "High-visibility root warning"

[custom.ssh]
command = "printf 'SSH'"
when = '''test -n "${SSH_CONNECTION:-}"'''
shell = ["/bin/sh"]
style = "bold fg:midnight bg:amber"
format = "[ $output ]($style) "
description = "High-visibility SSH warning"

# ── Host and location ────────────────────────────────────────────────────────

[os]
disabled = false
style = "bold fg:mint"
format = "[$symbol]($style) "

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"
Ubuntu = "󰕈"

[username]
show_always = false
style_user = "bold fg:cream"
style_root = "bold fg:critical"
format = "[$user]($style)"

[hostname]
ssh_only = true
trim_at = "."
style = "bold fg:amber"
format = "[@$hostname]($style) "

[directory]
style = "bold fg:mint"
read_only = " "
read_only_style = "bold fg:amber"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"
format = "[ $path]($style)[$read_only]($read_only_style) "

# ── Git ──────────────────────────────────────────────────────────────────────

[git_branch]
symbol = " "
style = "bold fg:coral"
truncation_length = 24
truncation_symbol = "…"
format = "[$symbol$branch]($style) "

[git_state]
style = "bold fg:amber"
format = "[\\($state( $progress_current/$progress_total)\\)]($style) "

[git_status]
style = ""
format = "([$all_status$ahead_behind]($style) )"
conflicted = "[!${count}](bold fg:critical)"
ahead = "[⇡${count}](bold fg:mint)"
behind = "[⇣${count}](bold fg:amber)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bold fg:coral)"
untracked = "[?${count}](bold fg:mint)"
stashed = '[\$${count}](bold fg:mint)'
modified = "[~${count}](bold fg:coral)"
staged = "[+${count}](bold fg:mint)"
renamed = "[»${count}](bold fg:coral)"
deleted = "[✘${count}](bold fg:critical)"

# ── Development context ──────────────────────────────────────────────────────

[python]
symbol = " "
style = "bold fg:coral"
format = "[$symbol$version( \\($virtualenv\\))]($style) "

[nodejs]
symbol = " "
style = "bold fg:mint"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "bold fg:amber"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "bold fg:mint"
format = "[$symbol$version]($style) "

# Keep these quiet until their workflows are deliberately configured.
[docker_context]
disabled = true

[kubernetes]
disabled = true

[package]
disabled = true

[shell]
disabled = true

[sudo]
disabled = true

[time]
disabled = true

# ── Command state ────────────────────────────────────────────────────────────

[jobs]
symbol = "󰜎 "
style = "bold fg:mint"
number_threshold = 1
symbol_threshold = 1
format = "[$symbol$number]($style) "

[cmd_duration]
min_time = 3000
show_milliseconds = false
style = "bold fg:amber"
format = "[󱎫 $duration]($style) "

[status]
disabled = false
symbol = "✘ "
not_executable_symbol = "NOEXEC "
not_found_symbol = "NOTFOUND "
sigint_symbol = "INT "
signal_symbol = "SIGNAL "
style = "bold fg:critical"
format = "[$symbol$status]($style) "
map_symbol = true
recognize_signal_code = true
pipestatus = true
pipestatus_separator = "[ | ](fg:muted)"
pipestatus_format = "[PIPE ](bold fg:critical)[$pipestatus]($style) "

[character]
success_symbol = "[❯](bold fg:mint)"
error_symbol = "[❯](bold fg:critical)"

# Native palette shared by all prompt styles above.
[palettes.fox_den_midnight]
midnight = "#0B1423"
slate = "#25384B"
mint = "#97E7CA"
coral = "#F68D91"
amber = "#F5AD66"
cream = "#F7F5E9"
raised = "#142335"
border = "#36495D"
muted = "#AFC0D1"
critical = "#EF5261"
